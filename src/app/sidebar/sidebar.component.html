<aside class="sidebar" [class.open]="isOpen">
  <div class="sidebar-header">
    
    <!-- Tasto Nuova Chat -->
    <button class="btn-new-chat" (click)="onNewChat.emit()">
      <span>+</span> Nuova Chat
    </button>
    
    <!-- Tasto Chiudi Sidebar (Icona Pannello) -->
    <button class="btn-toggle" (click)="onClose.emit()" title="Chiudi sidebar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="9" y1="3" x2="9" y2="21"></line>
      </svg>
    </button>

  </div>

  <div class="history-list">
    <div class="history-label">CRONOLOGIA</div>
    
    <div *ngFor="let session of history" 
         class="history-item" 
         [class.active]="session.id === currentSessionId"
         (click)="selectChat(session)">
      
      <span class="chat-icon">💬</span>
      <span class="chat-title">{{ session.title }}</span>
      <button class="btn-delete" (click)="deleteChat($event, session.id)" title="Elimina chat">🗑️</button>
    </div>

    <div *ngIf="history.length === 0" class="empty-history">
      Nessuna chat recente
    </div>
  </div>
</aside>
