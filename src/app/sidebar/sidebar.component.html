<aside class="sidebar" [class.open]="isOpen">
  <div class="sidebar-header">
    <button class="btn-new-chat" (click)="onNewChat.emit()">
      <i class="bi bi-plus-circle"></i> Nuova Chat
    </button>
  </div>

  <div class="history-list">
    <div class="history-label">
      <i class="bi bi-clock-history"></i> CRONOLOGIA
    </div>
    
    <div *ngFor="let session of history" 
         class="history-item" 
         [class.active]="session.id === currentSessionId"
         (click)="selectChat(session)">
      
      <i class="bi bi-chat-left-text chat-icon"></i>
      
      <!-- Titolo normale -->
      <span *ngIf="editingSessionId !== session.id" class="chat-title">
        {{ session.title }}
      </span>
      
      <!-- Input rinomina -->
      <input 
        *ngIf="editingSessionId === session.id"
        #renameInput
        class="rename-input"
        [value]="session.title"
        (blur)="cancelRename()"
        (keydown.enter)="confirmRename(session, $event)"
        (keydown.escape)="cancelRename()"
        (click)="$event.stopPropagation()"
      />
      
      <!-- Menu 3 puntini -->
      <div class="menu-container" *ngIf="editingSessionId !== session.id">
        <button class="btn-menu" (click)="toggleMenu($event, session.id)">
          <i class="bi bi-three-dots-vertical"></i>
        </button>
        
        <div class="dropdown-menu" *ngIf="openMenuId === session.id">
          <button class="dropdown-item" (click)="startRename($event, session)">
            <i class="bi bi-pencil"></i>
            Rinomina
          </button>
          <button class="dropdown-item delete" (click)="deleteChat($event, session.id)">
            <i class="bi bi-trash"></i>
            Elimina
          </button>
        </div>
      </div>
    </div>

    <div *ngIf="history.length === 0" class="empty-history">
      <i class="bi bi-chat-square-dots"></i>
      <p>Nessuna chat recente</p>
    </div>
  </div>
</aside>

<div class="menu-overlay" *ngIf="openMenuId" (click)="closeMenu()"></div>
