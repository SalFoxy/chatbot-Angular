<div class="chat-wrapper">

  <div class="messages"  #scrollContainer>
    <div
      *ngFor="let m of messages()"
      class="msg"
      [class.ai]="m.sender === 'ai'"
      [class.user]="m.sender === 'user'"
    >
            <!-- USER: testo normale -->
      <div *ngIf="m.sender === 'user'">
        {{ m.text }}
      </div>

      <!-- AI: testo renderizzato come Markdown -->
      <markdown
        *ngIf="m.sender === 'ai'"
        [data]="m.text"
      ></markdown>
    </div>
  </div>

  <div class="input-box">
    <input
      placeholder="Scrivi un messaggio..."
      [value]="userInput()"
      (input)="userInput.set($any($event.target).value)"
      (keyup.enter)="sendMessage()"
    />
    <button (click)="sendMessage()">➤</button>
  </div>

</div>
