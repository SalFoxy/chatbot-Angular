<div class="layout-wrapper">
  
  <app-sidebar
  [history]="history()"
  [currentSessionId]="currentSessionId()"
  [isOpen]="isSidebarOpen()"
  [isDarkMode]="isDarkMode()"
  (onSelect)="loadChat($event)"
  (onDelete)="handleDeleteChat($event)"
  (onRename)="handleRenameChat($event)"
  (onNewChat)="startNewChat()"
  (onClose)="toggleSidebar()"
  (onThemeToggle)="toggleTheme()"
></app-sidebar>

  <main class="main-content">
    
    <!-- TOP BAR -->
    <div class="top-bar">
      <button class="btn-toggle-main" (click)="toggleSidebar()" title="Mostra sidebar">
        <i class="bi bi-layout-sidebar"></i>
      </button>
      <span class="brand-mobile">LipariGPT</span>
    </div>

    <div class="messages" #scrollContainer (scroll)="onScroll()">
      <div *ngFor="let msg of messages(); let i = index" class="msg" [ngClass]="msg.sender">
        
        <!-- Avatar AI -->
        <div *ngIf="msg.sender === 'ai'" class="avatar ai">
          <i class="bi bi-robot"></i>
        </div>

        <!-- Bubble/Contenuto -->
        <div class="bubble" [appCollapsibleSections]="msg.sender === 'ai'">
          
          <!-- Se contiene :::polizza, usa il parser -->
          <div *ngIf="msg.sender === 'ai' && hasSpecialCard(msg.text)" 
               [appMessageParser]="msg.text">
          </div>
          
          <!-- Altrimenti usa markdown normale -->
          <markdown *ngIf="msg.sender === 'ai' && !hasSpecialCard(msg.text)" 
                    [data]="msg.text">
          </markdown>
          
          <span *ngIf="msg.sender === 'user'">{{ msg.text }}</span>
          
          <!-- Bottone Copia -->
          <button 
            *ngIf="msg.sender === 'ai' && msg.text" 
            class="btn-copy" 
            (click)="copyMessage(msg.text)"
            [title]="copiedIndex === i ? 'Copiato!' : 'Copia messaggio'">
            <i [class]="copiedIndex === i ? 'bi bi-check-lg' : 'bi bi-clipboard'"></i>
          </button>
        </div>
        
        <!-- Avatar User -->
        <div *ngIf="msg.sender === 'user'" class="avatar user">
          <i class="bi bi-person-fill"></i>
        </div>
        
      </div>
    </div>

    <!-- Scroll to Bottom Button -->
    <button 
      class="btn-scroll-bottom" 
      *ngIf="showScrollButton" 
      (click)="scrollToBottom()">
      <i class="bi bi-arrow-down"></i>
    </button>

    <div class="input-box">
      <div class="input-container">
        <textarea 
          #chatInput
          [disabled]="isLoading()"
          [(ngModel)]="userInput"
          (keydown)="handleKeydown($event)"
          placeholder="Scrivi a LipariGPT..."
          rows="1"
        ></textarea>
        <button (click)="sendMessage()" [disabled]="! userInput() || isLoading()">
          <i class="bi bi-send-fill"></i>
        </button>
      </div>
    </div>

    <!-- Overlay Mobile -->
    <div class="overlay" *ngIf="isSidebarOpen()" (click)="toggleSidebar()"></div>
  </main>
  <app-toast></app-toast>
  <app-modal></app-modal>
</div>
