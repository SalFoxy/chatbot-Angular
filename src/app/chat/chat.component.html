<div class="layout-wrapper">
  
  <app-sidebar
    [history]="history()"
    [currentSessionId]="currentSessionId()"
    [isOpen]="isSidebarOpen()"
    (onSelect)="loadChat($event)"
    (onDelete)="handleDeleteChat($event)"
    (onRename)="handleRenameChat($event)"
    (onNewChat)="startNewChat()"
    (onClose)="toggleSidebar()"
  ></app-sidebar>

  <main class="main-content">
    
    <!-- TOP BAR -->
    <div class="top-bar">
      <button class="btn-toggle-main" (click)="toggleSidebar()" title="Mostra sidebar">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>

      <span class="brand-mobile">LipariGPT</span>
    </div>

    <div class="messages" #scrollContainer>
      <div *ngFor="let msg of messages()" class="msg" [ngClass]="msg.sender">
        
        <!-- Avatar AI (solo per AI, a sinistra) -->
        <div *ngIf="msg.sender === 'ai'" class="avatar ai">🤖</div>

        <!-- Bubble/Contenuto -->
        <div class="bubble">
          <markdown *ngIf="msg.sender === 'ai'" [data]="msg.text"></markdown>
          <span *ngIf="msg.sender === 'user'">{{ msg.text }}</span>
        </div>
        
        <!-- Avatar User (solo per User, a destra) -->
        <div *ngIf="msg.sender === 'user'" class="avatar user">👤</div>
        
      </div>
    </div>

    <div class="input-box">
      <div class="input-container">
        <input 
          type="text" 
          #chatInput
          [disabled]="isLoading()"
          [(ngModel)]="userInput" 
          (keydown.enter)="sendMessage()"
          placeholder="Scrivi a LipariGPT..." 
        />
        <button (click)="sendMessage()" [disabled]="! userInput() || isLoading()">➤</button>
      </div>
    </div>

    <!-- Overlay Mobile -->
    <div class="overlay" *ngIf="isSidebarOpen()" (click)="toggleSidebar()"></div>
  </main>
</div>
